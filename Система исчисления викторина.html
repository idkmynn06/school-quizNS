<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎮 ИГРА: СИСТЕМЫ СЧИСЛЕНИЯ (10 класс)</title>
  <style>
    /* CSS Variables for Dark Cyberpunk Theme */
    :root {
      --bg-dark: #071a3d;
      --bg-card: rgba(13, 31, 69, 0.75);
      --border-glow: rgba(0, 243, 255, 0.3);
      --cyan-neon: #00f3ff;
      --purple-neon: #9d4edd;
      --green-glow: #00ff88;
      --red-glow: #ff3366;
      --text-main: #f0f6fc;
      --text-muted: #a3b8cc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
      padding: 20px 10px;
    }

    /* Background Canvas for Binary / Math FX */
    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      opacity: 0.25;
    }

    /* Container Card */
    .app-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 720px;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glow);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5),
                  0 0 20px rgba(0, 243, 255, 0.15);
      transition: all 0.3s ease;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(135deg, var(--cyan-neon), var(--purple-neon));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
      margin-bottom: 6px;
    }

    .header p {
      font-size: 1rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Top Stats Bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      background: rgba(255, 255, 255, 0.04);
      padding: 12px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-weight: 600;
      font-size: 0.95rem;
    }

    .badge-score {
      color: var(--cyan-neon);
      display: flex;
      align-items: center;
      gap: 6px;
      text-shadow: 0 0 8px rgba(0, 243, 255, 0.5);
    }

    /* Score Increment Animation */
    .score-pop {
      animation: pop 0.4s ease-out;
    }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); color: var(--green-glow); }
      100% { transform: scale(1); }
    }

    /* Progress Bar */
    .progress-container {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--cyan-neon), var(--purple-neon));
      box-shadow: 0 0 12px var(--cyan-neon);
      border-radius: 20px;
      transition: width 0.4s ease;
    }

    /* Question Container Animation */
    .question-card {
      animation: fadeIn 0.4s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .question-title {
      font-size: 1.25rem;
      line-height: 1.5;
      margin-bottom: 20px;
      font-weight: 600;
    }

    /* Options / Buttons */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    @media (min-width: 600px) {
      .options-grid.two-cols {
        grid-template-columns: 1fr 1fr;
      }
    }

    .option-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 14px 18px;
      color: var(--text-main);
      font-size: 1rem;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 10px;
      outline: none;
    }

    .option-btn:hover:not(:disabled) {
      background: rgba(0, 243, 255, 0.12);
      border-color: var(--cyan-neon);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0, 243, 255, 0.2);
    }

    .option-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    /* Text Input Area */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .text-input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(0, 243, 255, 0.3);
      color: #ffffff;
      font-size: 1.1rem;
      letter-spacing: 1px;
      outline: none;
      transition: all 0.2s ease;
    }

    .text-input:focus {
      border-color: var(--cyan-neon);
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
    }

    .text-input:disabled {
      opacity: 0.7;
    }

    .btn-submit {
      background: linear-gradient(135deg, var(--cyan-neon), #00a8ff);
      color: #040e24;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
    }

    .btn-submit:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 0 22px rgba(0, 243, 255, 0.5);
    }

    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* Feedback Banner */
    .feedback-box {
      border-radius: 12px;
      padding: 16px 20px;
      margin-top: 20px;
      animation: fadeIn 0.3s ease;
      display: none;
    }

    .feedback-box.correct {
      background: rgba(0, 255, 136, 0.12);
      border: 1px solid var(--green-glow);
      color: #e0ffea;
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
    }

    .feedback-box.incorrect {
      background: rgba(255, 51, 102, 0.12);
      border: 1px solid var(--red-glow);
      color: #ffe0e6;
      box-shadow: 0 0 15px rgba(255, 51, 102, 0.2);
    }

    .feedback-header {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .solution-title {
      font-weight: 700;
      margin-top: 10px;
      margin-bottom: 4px;
      color: var(--cyan-neon);
      font-size: 0.95rem;
    }

    .solution-text {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.95rem;
      background: rgba(0, 0, 0, 0.3);
      padding: 10px;
      border-radius: 8px;
      line-height: 1.5;
      white-space: pre-wrap;
      border-left: 3px solid var(--cyan-neon);
      color: #d1f7ff;
    }

    /* Next Button */
    .btn-next {
      margin-top: 20px;
      width: 100%;
      background: linear-gradient(135deg, var(--purple-neon), #6c5ce7);
      color: #fff;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 0 15px rgba(157, 78, 221, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-next:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 22px rgba(157, 78, 221, 0.5);
    }

    /* Final Screen */
    .final-screen {
      text-align: center;
      padding: 10px 0;
      display: none;
      animation: fadeIn 0.5s ease-out;
    }

    .final-title {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #00ff88, var(--cyan-neon));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
    }

    .final-score {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .final-percent {
      font-size: 1.2rem;
      color: var(--cyan-neon);
      margin-bottom: 20px;
    }

    .final-message {
      font-size: 1.3rem;
      font-weight: 700;
      padding: 16px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 28px;
      color: #ffffff;
    }

    .btn-restart {
      background: linear-gradient(135deg, var(--cyan-neon), var(--purple-neon));
      color: #040e24;
      font-weight: 800;
      border: none;
      border-radius: 12px;
      padding: 16px 28px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .btn-restart:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.7);
    }

    sub, sup {
      font-size: 0.75em;
      line-height: 0;
      position: relative;
      vertical-align: baseline;
    }
    sub { bottom: -0.25em; }
    sup { top: -0.5em; }
  </style>
</head>
<body>

  <!-- Floating particles / binary canvas -->
  <canvas id="bg-canvas"></canvas>

  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <h1>🎮 ИГРА: СИСТЕМЫ СЧИСЛЕНИЯ</h1>
      <p>10 класс | Проверь свои знания!</p>
    </header>

    <!-- Quiz Content Container -->
    <div id="quiz-view">
      <!-- Status Bar -->
      <div class="status-bar">
        <span id="question-tracker">Вопрос 1 из 10</span>
        <span id="score-tracker" class="badge-score">⭐ Баллы: 0 / 10</span>
      </div>

      <!-- Progress Bar -->
      <div class="progress-container">
        <div id="progress-bar" class="progress-bar"></div>
      </div>

      <!-- Dynamic Question Card -->
      <div id="question-card" class="question-card">
        <div id="question-text" class="question-title">Загрузка вопроса...</div>
        <div id="interaction-area"></div>
      </div>

      <!-- Feedback Area -->
      <div id="feedback-box" class="feedback-box">
        <div id="feedback-header" class="feedback-header"></div>
        <div id="solution-container">
          <div class="solution-title">Подробное решение:</div>
          <div id="solution-text" class="solution-text"></div>
        </div>
        <button id="btn-next" class="btn-next" onclick="nextQuestion()">Дальше ➔</button>
      </div>
    </div>

    <!-- Final Results View -->
    <div id="final-screen" class="final-screen">
      <h2 class="final-title">🎉 ИГРА ЗАВЕРШЕНА!</h2>
      <div id="final-score" class="final-score">Ваш результат: 0 / 10 баллов</div>
      <div id="final-percent" class="final-percent">Точность: 0%</div>
      <div id="final-message" class="final-message">Сообщение</div>
      <button class="btn-restart" onclick="restartGame()">🔄 Пройти игру ещё раз</button>
    </div>
  </div>

  <script>
    // --- 1. QUESTIONS DATABASE ---
    const questionsData = [
      {
        id: 1,
        type: "mcq",
        question: "Что такое система счисления?",
        options: [
          "Знаковая система, в которой числа записываются по определённым правилам с помощью цифр",
          "Компьютерная программа для выполнения арифметических операций с дробями",
          "Правило выполнения логических операций в процессоре",
          "Таблица соответствия символов Unicode кодам ASCII"
        ],
        correct: 0,
        solution: "Система счисления — это знаковая система, в которой числа записываются по определённым правилам с помощью специального набора символов (цифр)."
      },
      {
        id: 2,
        type: "mcq",
        question: "Какое основание имеет шестнадцатеричная система счисления?",
        options: ["2", "8", "10", "16"],
        correct: 3,
        solution: "Шестнадцатеричная система счисления имеет основание 16. В ней используются цифры от 0 до 9 и буквы A, B, C, D, E, F."
      },
      {
        id: 3,
        type: "input",
        question: "Переведите 101101₂ в десятичную систему счисления.",
        correctAnswer: "45",
        solution: "101101₂ = 1×2⁵ + 0×2⁴ + 1×2³ + 1×2² + 0×2¹ + 1×2⁰\n= 32 + 0 + 8 + 4 + 0 + 1 = 45₁₀"
      },
      {
        id: 4,
        type: "input",
        question: "Переведите число 53₁₀ в двоичную систему счисления.",
        correctAnswer: "110101",
        solution: "Делим 53 на 2 с остатком:\n53 ÷ 2 = 26 (остаток 1)\n26 ÷ 2 = 13 (остаток 0)\n13 ÷ 2 = 6  (остаток 1)\n 6 ÷ 2 = 3  (остаток 0)\n 3 ÷ 2 = 1  (остаток 1)\n 1 ÷ 2 = 0  (остаток 1)\nЗаписываем остатки снизу вверх: 110101₂"
      },
      {
        id: 5,
        type: "input",
        question: "Переведите двоичное число 11011011₂ в шестнадцатеричную систему.",
        correctAnswer: "DB",
        solution: "Разбиваем число на тетрады (по 4 цифры справа налево):\n1101₂ = 13₁₀ = D₁₆\n1011₂ = 11₁₀ = B₁₆\nПолучаем: DB₁₆"
      },
      {
        id: 6,
        type: "input",
        question: "Переведите 1A₁₆ в десятичную систему счисления.",
        correctAnswer: "26",
        solution: "1A₁₆ (где A = 10):\n1A₁₆ = 1×16¹ + 10×16⁰\n= 16 + 10 = 26₁₀"
      },
      {
        id: 7,
        type: "input",
        question: "Переведите 75₈ в десятичную систему счисления.",
        correctAnswer: "61",
        solution: "75₈ = 7×8¹ + 5×8⁰\n= 56 + 5 = 61₁₀"
      },
      {
        id: 8,
        type: "mcq",
        question: "Сравните числа A = 11010₂ и B = 33₈. Какое утверждение верно?",
        options: ["A > B", "A < B", "A = B"],
        correct: 1,
        solution: "Переведём оба числа в десятичную систему счисления:\nA = 11010₂ = 16 + 8 + 0 + 2 + 0 = 26₁₀\nB = 33₈ = 3×8 + 3 = 24 + 3 = 27₁₀\nТак как 26 < 27, получаем: A < B."
      },
      {
        id: 9,
        type: "input",
        question: "Вычислите сумму двоичных чисел: 1011₂ + 1101₂. (Ответ запишите в двоичной системе)",
        correctAnswer: "11000",
        solution: "Складываем столбиком:\n  1011₂ (11₁₀)\n+ 1101₂ (13₁₀)\n-------\n 11000₂ (24₁₀)\n11 + 13 = 24, а 24₁₀ = 11000₂"
      },
      {
        id: 10,
        type: "input",
        question: "Переведите 2AF₁₆ в восьмеричную систему счисления.",
        correctAnswer: "1257",
        solution: "1) Переводим 2AF₁₆ в двоичную систему (каждую цифру в тетраду):\n2 = 0010, A = 1010, F = 1111 → 001010101111₂\n\n2) Разбиваем на триады (по 3 цифры справа налево):\n001 | 010 | 101 | 111\n 1  |  2  |  5  |  7\nПолучаем: 1257₈"
      }
    ];

    // --- 2. GAME STATE VARIABLES ---
    let currentQuestionIndex = 0;
    let score = 0;
    let answeredCurrent = false;

    // --- 3. CANVAS DIGITAL BACKGROUND ANIMATION ---
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.char = Math.random() > 0.5 ? (Math.random() > 0.5 ? '1' : '0') : ['A','F','8','2','+'][Math.floor(Math.random()*5)];
        this.speed = 0.3 + Math.random() * 0.8;
        this.size = 12 + Math.random() * 16;
        this.opacity = 0.1 + Math.random() * 0.4;
      }
      update() {
        this.y -= this.speed;
        if (this.y < -20) {
          this.y = canvas.height + 20;
          this.x = Math.random() * canvas.width;
        }
      }
      draw() {
        ctx.fillStyle = `rgba(0, 243, 255, ${this.opacity})`;
        ctx.font = `${this.size}px monospace`;
        ctx.fillText(this.char, this.x, this.y);
      }
    }

    for(let i = 0; i < 45; i++) {
      particles.push(new Particle());
    }

    function animateBackground() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateBackground);
    }
    animateBackground();

    // --- 4. GAME ENGINE LOGIC ---
    function renderQuestion() {
      answeredCurrent = false;
      const q = questionsData[currentQuestionIndex];

      // Update Top Status Bar
      document.getElementById('question-tracker').innerText = `Вопрос ${currentQuestionIndex + 1} из ${questionsData.length}`;
      document.getElementById('score-tracker').innerText = `⭐ Баллы: ${score} / ${questionsData.length}`;
      
      const progressPercent = ((currentQuestionIndex) / questionsData.length) * 100;
      document.getElementById('progress-bar').style.width = `${progressPercent}%`;

      // Hide Feedback Box
      const feedbackBox = document.getElementById('feedback-box');
      feedbackBox.style.display = 'none';
      feedbackBox.className = 'feedback-box';

      // Set Title
      const qCard = document.getElementById('question-card');
      qCard.classList.remove('question-card');
      void qCard.offsetWidth; // Trigger reflow
      qCard.classList.add('question-card');

      document.getElementById('question-text').innerHTML = q.question;

      // Render Inputs or Buttons
      const interactionArea = document.getElementById('interaction-area');
      interactionArea.innerHTML = '';

      if (q.type === 'mcq') {
        const grid = document.createElement('div');
        grid.className = `options-grid ${q.options.length <= 3 ? '' : 'two-cols'}`;
        
        q.options.forEach((opt, idx) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.innerHTML = `<span style="color:var(--cyan-neon); font-weight:700;">${String.fromCharCode(65 + idx)}.</span> ${opt}`;
          btn.onclick = () => handleMCQAnswer(idx);
          grid.appendChild(btn);
        });
        interactionArea.appendChild(grid);
      } else if (q.type === 'input') {
        const inputGroup = document.createElement('div');
        inputGroup.className = 'input-group';
        
        const input = document.createElement('input');
        input.type = 'text';
        input.id = 'user-text-input';
        input.className = 'text-input';
        input.placeholder = 'Введите ваш ответ...';
        input.autocomplete = 'off';

        input.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') {
            handleInputAnswer();
          }
        });

        const submitBtn = document.createElement('button');
        submitBtn.className = 'btn-submit';
        submitBtn.innerText = 'Отправить ответ';
        submitBtn.onclick = handleInputAnswer;

        inputGroup.appendChild(input);
        inputGroup.appendChild(submitBtn);
        interactionArea.appendChild(inputGroup);

        setTimeout(() => input.focus(), 100);
      }
    }

    // Handle MCQ Submission
    function handleMCQAnswer(selectedIndex) {
      if (answeredCurrent) return;
      answeredCurrent = true;

      const q = questionsData[currentQuestionIndex];
      const isCorrect = selectedIndex === q.correct;
      const btns = document.querySelectorAll('.option-btn');

      btns.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === q.correct) {
          btn.style.borderColor = 'var(--green-glow)';
          btn.style.background = 'rgba(0, 255, 136, 0.2)';
        } else if (idx === selectedIndex && !isCorrect) {
          btn.style.borderColor = 'var(--red-glow)';
          btn.style.background = 'rgba(255, 51, 102, 0.2)';
        }
      });

      processResult(isCorrect, q);
    }

    // Handle Text Input Submission
    function handleInputAnswer() {
      if (answeredCurrent) return;
      
      const inputEl = document.getElementById('user-text-input');
      const userVal = inputEl.value.trim().toUpperCase();
      if (!userVal) return;

      answeredCurrent = true;
      inputEl.disabled = true;

      const submitBtn = document.querySelector('.btn-submit');
      if (submitBtn) submitBtn.disabled = true;

      const q = questionsData[currentQuestionIndex];
      const isCorrect = (userVal === q.correctAnswer.toUpperCase());

      if (isCorrect) {
        inputEl.style.borderColor = 'var(--green-glow)';
        inputEl.style.boxShadow = '0 0 12px rgba(0, 255, 136, 0.4)';
      } else {
        inputEl.style.borderColor = 'var(--red-glow)';
        inputEl.style.boxShadow = '0 0 12px rgba(255, 51, 102, 0.4)';
      }

      processResult(isCorrect, q);
    }

    // Process & Show Feedback
    function processResult(isCorrect, q) {
      const feedbackBox = document.getElementById('feedback-box');
      const feedbackHeader = document.getElementById('feedback-header');
      const solutionText = document.getElementById('solution-text');

      feedbackBox.style.display = 'block';

      if (isCorrect) {
        score++;
        // Animate score counter
        const scoreTracker = document.getElementById('score-tracker');
        scoreTracker.classList.remove('score-pop');
        void scoreTracker.offsetWidth;
        scoreTracker.classList.add('score-pop');
        scoreTracker.innerText = `⭐ Баллы: ${score} / ${questionsData.length}`;

        feedbackBox.classList.add('correct');
        feedbackHeader.innerHTML = '✅ Правильно! +1 балл';
      } else {
        feedbackBox.classList.add('incorrect');
        let correctDisplay = q.type === 'mcq' ? q.options[q.correct] : q.correctAnswer;
        feedbackHeader.innerHTML = `❌ Ответ неверный<br><span style="font-size:0.95rem; font-weight:500; margin-top:4px; display:inline-block;">Правильный ответ: <b>${correctDisplay}</b></span>`;
      }

      solutionText.innerText = q.solution;
    }

    // Advance to Next Question or Finish
    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < questionsData.length) {
        renderQuestion();
      } else {
        showFinalResults();
      }
    }

    // --- 5. FINAL SCREEN LOGIC ---
    function showFinalResults() {
      document.getElementById('quiz-view').style.display = 'none';
      const finalScreen = document.getElementById('final-screen');
      finalScreen.style.display = 'block';

      // Update Progress Bar to 100%
      document.getElementById('progress-bar').style.width = '100%';

      const percentage = Math.round((score / questionsData.length) * 100);
      document.getElementById('final-score').innerText = `Ваш результат: ${score} / ${questionsData.length} баллов`;
      document.getElementById('final-percent').innerText = `Точность: ${percentage}%`;

      const msgEl = document.getElementById('final-message');
      
      // Strict Grade Messages based on specifications
      if (score <= 4) {
        msgEl.innerText = 'Требуется повторить материал';
        msgEl.style.borderColor = 'var(--red-glow)';
        msgEl.style.boxShadow = '0 0 15px rgba(255, 51, 102, 0.2)';
      } else if (score >= 5 && score <= 7) {
        msgEl.innerText = 'Усвоил неплохо материал!';
        msgEl.style.borderColor = 'var(--cyan-neon)';
        msgEl.style.boxShadow = '0 0 15px rgba(0, 243, 255, 0.2)';
      } else {
        msgEl.innerText = 'Отлично усвоил материал!';
        msgEl.style.borderColor = 'var(--green-glow)';
        msgEl.style.boxShadow = '0 0 20px rgba(0, 255, 136, 0.3)';
      }
    }

    // Restart Game Reset
    function restartGame() {
      score = 0;
      currentQuestionIndex = 0;
      document.getElementById('final-screen').style.display = 'none';
      document.getElementById('quiz-view').style.display = 'block';
      renderQuestion();
    }

    // Initialize Game on Window Load
    window.onload = function() {
      renderQuestion();
    };
  </script>
</body>
</html>
